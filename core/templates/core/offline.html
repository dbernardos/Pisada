{% load static %}<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Sem conexão - Baropodometria</title>
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}" />

  <body>
